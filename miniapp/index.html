<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080a0f">

  <title>Saksham Mini App</title>

  <link
    rel="stylesheet"
    href="/miniapp/static/style.css"
  >
</head>

<body>

  <!-- Background -->
  <div class="app-bg"></div>

  <main class="app">

    <!-- =========================
         AUTH / LOGIN SCREEN
    ========================== -->

    <section id="authView" class="screen">

      <!-- Brand -->
      <div class="brand">

        <div class="brand-mark">
          S
        </div>

        <div>
          <div class="brand-name">
            SAKSHAM
          </div>

          <div class="brand-sub">
            MINI APP
          </div>
        </div>

      </div>


      <!-- Authentication Card -->
      <div class="hero-card">

        <span class="eyebrow">
          PERSONAL SPACE
        </span>

        <h1 id="authTitle">
          Create your account
        </h1>

        <p id="authText">
          Register once and use your personal dashboard every time.
        </p>


        <!-- Telegram Account -->
        <div id="telegramBox" class="telegram-box">

          <span>
            ✈️
          </span>

          <div>

            <small>
              Telegram account
            </small>

            <strong id="tgUser">
              @telegram_user
            </strong>

          </div>

          <span class="verified">
            ✓
          </span>

        </div>


        <!-- Auth Form -->
        <form id="authForm">

          <!-- Username -->
          <label id="usernameLabel">
            App username
          </label>

          <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="Choose a username"
            required
          >


          <!-- Password -->
          <label>
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="Create a password"
            required
          >


          <!-- Confirm Password -->
          <div id="confirmWrap">

            <label>
              Confirm password
            </label>

            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Re-enter password"
            >

          </div>


          <!-- Submit -->
          <button
            class="primary"
            type="submit"
            id="authButton"
          >
            CREATE ACCOUNT

            <span>
              →
            </span>

          </button>

        </form>


        <!-- Login/Register Switch -->
        <button
          class="switch"
          id="switchMode"
          type="button"
        >
          Already have an account?
          <b>
            Login
          </b>
        </button>


        <!-- Security -->
        <p class="security-note">
          🔒 Your password will be securely hashed on the server.
        </p>

      </div>

    </section>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <section
      id="dashboardView"
      class="screen hidden"
    >

      <!-- Top Bar -->
      <header class="topbar">

        <div>

          <span class="eyebrow">
            WELCOME BACK
          </span>

          <h2 id="dashName">
            User
          </h2>

        </div>

        <div
          class="avatar"
          id="dashAvatar"
        >
          S
        </div>

      </header>


      <!-- Coins -->
      <div class="balance-card">

        <div>

          <span class="card-label">
            COINS
          </span>

          <strong id="coins">
            0
          </strong>

        </div>

        <div class="coin-icon">
          🪙
        </div>

      </div>


      <!-- Stats -->
      <div class="stats-grid">

        <div class="stat-card">

          <span>
            ⭐ XP
          </span>

          <strong id="xp">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span>
            🏆 LEVEL
          </span>

          <strong id="level">
            1
          </strong>

        </div>


        <div class="stat-card">

          <span>
            📊 RANK
          </span>

          <strong id="rank">
            —
          </strong>

        </div>


        <div class="stat-card">

          <span>
            💎 STATUS
          </span>

          <strong id="status">
            MEMBER
          </strong>

        </div>

      </div>


      <!-- Quick Access -->
      <h3>
        Quick access
      </h3>


      <div class="quick-grid">

        <button
          class="feature"
          type="button"
        >

          <span>
            🛍️
          </span>

          Shop

        </button>


        <button
          class="feature"
          type="button"
        >

          <span>
            🎁
          </span>

          Rewards

        </button>


        <button
          class="feature"
          type="button"
        >

          <span>
            👥
          </span>

          Referral

        </button>


        <button
          class="feature"
          type="button"
        >

          <span>
            👤
          </span>

          Profile

        </button>

      </div>


      <!-- Bottom Navigation -->
      <nav class="bottom-nav">

        <button
          class="active"
          type="button"
        >

          <span>
            ⌂
          </span>

          <small>
            Home
          </small>

        </button>


        <button type="button">

          <span>
            🛍
          </span>

          <small>
            Shop
          </small>

        </button>


        <button type="button">

          <span>
            🏆
          </span>

          <small>
            Rank
          </small>

        </button>


        <button type="button">

          <span>
            👤
          </span>

          <small>
            Profile
          </small>

        </button>


        <button type="button">

          <span>
            ⚙
          </span>

          <small>
            Settings
          </small>

        </button>

      </nav>

    </section>

  </main>


  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Our JavaScript -->
  <script src="/miniapp/static/app.js"></script>

</body>
</html>
